name: Daily work log

# 工作日纽约 18:00 起自动抓取当天记录。
# GitHub 定时任务常延迟甚至被丢弃，所以在晚上多排几次：第一次成功后，后续运行发现当天文件已存在即跳过。
# cron 只认 UTC，脚本按纽约时间判断星期和时刻（18:00 前、周末都跳过）：
#   EDT：18:17 18:47 19:17 19:47 21:17 23:17
#   EST：18:17 18:47 20:17 22:17（17:xx 的两次跳过）
on:
  schedule:
    - cron: "17,47 22,23 * * 1-5"
    - cron: "17 1,3 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略时间与重复检查，立即重新生成今天的记录"
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

concurrency:
  group: worklog
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collect today's activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/worklog.py log --at-hour 18 ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "log: $(TZ=America/New_York date +%F)"
          git pull --rebase --autostash
          git push
