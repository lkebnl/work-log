name: Daily work log

# 工作日纽约 18:00 自动抓取当天记录。
# Actions 的 cron 只认 UTC，所以同时排 22:07 和 23:07 UTC（分别对应 EDT / EST 的 18:07），
# 脚本按纽约本地时间判断，只有正确的那一次会真正执行。
on:
  schedule:
    - cron: "7 22 * * 1-5"
    - cron: "7 23 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略时间与重复检查，立即重新生成今天的记录"
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

concurrency:
  group: worklog
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect today's activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/worklog.py log --at-hour 18 ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "log: $(TZ=America/New_York date +%F)"
          git pull --rebase --autostash
          git push
