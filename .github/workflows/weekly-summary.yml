name: Weekly work-log summary

# 每周五纽约 18:20 生成周报（在 18:07 的日志之后），全部由代码生成，不调用 AI：
#   reports/YYYY/YYYY-Www.md  ← 本周概况表、关闭/新建、7 天未动项、按工作线分组的全部评论（带链接）
#   charts/daily-<日期>.png、effort-<日期>.png（以及 *-latest.png）
# cron 只认 UTC：22:20 / 23:20 UTC 分别对应 EDT / EST 的 18:20，脚本按纽约时间只执行一次。
on:
  schedule:
    - cron: "20 22 * * 5"
    - cron: "20 23 * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略星期、时间与重复检查，立即重新生成本周周报"
        type: boolean
        default: false
      weeks:
        description: "精力分布图显示最近几周"
        default: "8"
      daily_days:
        description: "每日图显示最近几天"
        default: "14"

permissions:
  contents: write
  issues: read

concurrency:
  group: worklog
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build weekly report
        id: week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/worklog.py week --at-hour 18 --charts ${{ inputs.force && '--force' || '' }}

      - name: Install chart dependencies
        if: steps.week.outputs.wrote == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q matplotlib

      - name: Draw charts
        if: steps.week.outputs.wrote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WEEKS: ${{ inputs.weeks || '8' }}
          DAILY_DAYS: ${{ inputs.daily_days || '14' }}
          REPORT_LANG: zh
        run: python3 .github/scripts/weekly_report.py

      - name: Commit
        if: steps.week.outputs.wrote == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports charts logs/.state.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "report: $(TZ=America/New_York date +%G-W%V)"
          git pull --rebase --autostash
          git push
