name: Morning plan

# 工作日纽约 08:00 生成当天计划：代码生成完整清单，顶部附 3–5 条 AI 建议（GitHub Models）。
# 12:03 / 13:03 UTC 分别对应 EDT / EST 的 08:03。
on:
  schedule:
    - cron: "3 12 * * 1-5"
    - cron: "3 13 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略时间与重复检查，立即重新生成今天的计划"
        type: boolean
        default: false

permissions:
  contents: write
  issues: read
  models: read      # 用 GITHUB_TOKEN 调用 GitHub Models 生成建议

concurrency:
  group: worklog
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build today's plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # 读取 Project 的 Status 字段需要 classic PAT（read:project）。
          # 未配置时自动退化为按最近更新列出所有 open issue。
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          # AI 建议：可选 variable PLAN_AI=0 关闭；MODEL 指定模型
          PLAN_AI: ${{ vars.PLAN_AI || '1' }}
          MODEL: ${{ vars.MODEL || 'openai/gpt-4.1-mini' }}
        run: python3 .github/scripts/worklog.py plan --at-hour 8 ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plans
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "plan: $(TZ=America/New_York date +%F)"
          git pull --rebase --autostash
          git push
